name: M5 Sniper Backtest

on:
  workflow_dispatch: # لتشغيله يدوياً عند الحاجة
  schedule:
    - cron: '0 0 * * 0' # تشغيل أسبوعي تلقائي (اختياري)

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy

      - name: Run Backtest
        run: |
          python backtest_m5_sniper.py
