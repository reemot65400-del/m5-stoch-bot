name: M15 BB Sniper Bot (State Persistent v3.9 - FINAL)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: m15-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run M15 Bot Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python m5_bot.py  # تأكد أن هذا الاسم يطابق اسم ملفك في GitHub

      - name: Persist bot state (commit & push)
        if: always()
        run: |
          git config user.name "m15-bot"
          git config user.email "m15-bot@users.noreply.github.com"
          git add state_m15_fixed_gaza.json
          if git diff --cached --quiet; then
            echo ">>> State unchanged."
          else
            git commit -m "chore: persist bot state [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo ">>> State pushed to repository successfully."
          fi
