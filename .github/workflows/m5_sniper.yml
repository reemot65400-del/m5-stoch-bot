name: M5 Sniper Bot (M15 BB Strategy)

on:
  # تم تعطيل الجدول الزمني الداخلي لتجنب التعارض مع النبضة الخارجية
  # schedule:
  #   - cron: '*/15 * * * *' 
  
  workflow_dispatch: # يستقبل الأوامر من النبضة الخارجية فقط
    inputs:
      debug_mode:
        description: 'Run in debug mode'
        required: false
        default: 'false'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # وقت كافٍ لفحص 14 زوجاً
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Execute M15 BB Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
        run: python m5_bot.py
