name: M5 Sniper Bot (M15 BB Strategy)

on:
  schedule:
    # تشغيل البوت تلقائياً كل 15 دقيقة (متوافق مع فريم الاستراتيجية الجديد)
    - cron: '*/15 * * * *' 
  workflow_dispatch: # يسمح لك بتشغيله يدوياً في أي وقت للتجربة

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # وقت كافٍ لفحص 14 زوجاً
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Execute M15 BB Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python m5_bot.py
