name: Run Stochastic v9.9 Backtest

on:
  workflow_dispatch: # يسمح بالتشغيل اليدوي فقط

jobs:
  run-stoch-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # وقت كافٍ لفحص كل شموع الـ 50 يوماً بدقة
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # تثبيت المكتبات الأساسية فقط (بدون pandas_ta)
          pip install yfinance pandas numpy

      - name: Execute Stochastic Backtest Script
        run: python backtest_stoch_v99.py
        
      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoch-v99-results
          path: results_stoch_v99.txt
