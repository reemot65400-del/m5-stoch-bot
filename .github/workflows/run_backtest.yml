name: Run Sniper Backtest Lab

on:
  workflow_dispatch: # يسمح بالتشغيل اليدوي فقط عبر زر Run workflow

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # إعطاء وقت كافٍ (20 دقيقة) لإنهاء الاختبار
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # تثبيت المكتبات الأساسية فقط (بدون pandas_ta لتجنب الأخطاء)
          pip install yfinance pandas numpy

      - name: Execute Backtest Script
        run: python backtest_sniper_lab.py
        
      - name: Upload Results Artifact
        if: always() # يرفع الملف حتى لو فشل السكربت (لرؤية سجل الأخطاء)
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results.txt
