name: Strategy Lab Backtest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # يسمح بالتشغيل اليدوي من واجهة GitHub
  schedule:
    # تشغيل يومي في الساعة 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  backtest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # جرب تثبيت requirements_v2.txt، وإذا فشل جرب requirements.txt
        if [ -f requirements_v2.txt ]; then
          pip install -r requirements_v2.txt
        else
          pip install -r requirements.txt
        fi
        pip show ta yfinance pandas

    - name: Run Strategy Lab
      run: |
        python strategy_lab.py
