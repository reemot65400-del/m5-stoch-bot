name: Financial Sniper Backtest v1.0 (Tri-Confluence Engine)

on:
  # التشغيل اليدوي فقط للتحكم الدقيق في وقت التنفيذ
  workflow_dispatch:
  
  # يمكنك تفعيل هذا الجزء إذا أردت تشغيله تلقائياَ عند تعديل ملف الكود
  # push:
  #   paths:
  #     - 'sniper_backtest_v1.py'

jobs:
  sniper-test-job-v1:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # تثبيت المكتبات المطلوبة للمحرك الثلاثي (Multi-Timeframe)
          pip install pandas numpy yfinance
      
      - name: Run Financial Sniper Backtest Script (v1.0)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=================================================="
          echo "STARTING: FINANCIAL SNIPER SYSTEM BACKTEST"
          echo "VERSION: 1.0 (Strict Tri-Confluence Mode)"
          echo "SCRIPT: sniper_backtest_v1.py"
          echo "LOGIC: EMA(H1) + ATR(M15) + MACD(M5) + Survival Protocol"
          echo "=================================================="
          
          # تنفيذ السكربت وحفظ المخرجات في ملف نصي
          # نستخدم timeout لمنع التعليق اللانهائي في حال تعطل اتصال Yahoo Finance
          # الحد الأقصى 20 دقيقة كافٍ لمعالجة 16 زوجاً لسنة واحدة
          timeout 1200s python sniper_backtest_v1.py > sniper_results_v1.txt || echo "Process finished or timed out."
          
          # عرض النتائج على شاشة الـ Log فوراَ
          cat sniper_results_v1.txt
          
          echo "=================================================="
          echo "SNIPER TEST COMPLETED."
          echo "Results saved to: sniper_results_v1.txt"
          echo "=================================================="
          
      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-sniper-backtest-results-v1
          path: sniper_results_v1.txt
          retention-days: 7
